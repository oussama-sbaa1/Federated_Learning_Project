syntax = "proto3";

package federated;

message RegisterParticipantRequest {
  string participant_id = 1;
}

message RegisterParticipantReply {
  bool success = 1;
  string message = 2;
}
message TrainingConfig {
    int32 num_rounds = 1;
    int32 local_epochs = 2;
    double learning_rate = 3;
}
message ModelParameters {
    repeated double weights = 1;
}
enum JobStatus{
    PENDING = 0;
    IN_PROGRESS = 1;
    COMPLETED = 2;
    FAILED = 3;
}
message TrainingTask { 
   string job_id = 1;
   int32 round_number = 2;
   TrainingConfig config= 3;
   ModelParameters global_weights = 4;
}
message TrainingResult {
    string job_id = 1;
    string participant_id = 2;
    int32 round_number = 3;
    ModelParameters updated_weights = 4;
    int32 num_samples = 5;
    double loss = 6;
}
message CreateJobRequest {
    TrainingConfig config = 1;
    repeated string participant_ids = 2;
}
message CreateJobReply {
    string job_id = 1;
}
message StartTrainingRequest { 
    string job_id = 1;
}
message StartTrainingReply {
    bool success = 1;
    string message = 2;
}
message GetTrainingStatusRequest { 
    string job_id = 1;
}
message TrainingStatus { 
    string job_id = 1;
    JobStatus status = 2;
    int32 current_round = 3;
    int32 num_rounds = 4;
    ModelParameters global_weights = 5;

}
message GetTrainingTaskRequest { 
    string participant_id = 1;
}
enum TaskState { 
    WAIT = 0;
    TASK_READY = 1;
    FINISHED = 2;
}
message GetTrainingTaskReply {
    TaskState state = 1;
    TrainingTask task = 2;
}
message SubmitTrainingResultReply {
    bool success = 1;
    string message = 2;
}
service Coordinator {
  rpc RegisterParticipant (RegisterParticipantRequest) returns (RegisterParticipantReply);
  rpc CreateJob (CreateJobRequest) returns (CreateJobReply);
  rpc StartTraining (StartTrainingRequest) returns (StartTrainingReply);
  rpc GetTrainingStatus (GetTrainingStatusRequest) returns (TrainingStatus);
  rpc GetTrainingTask (GetTrainingTaskRequest) returns (GetTrainingTaskReply);
  rpc SubmitTrainingResult (TrainingResult) returns (SubmitTrainingResultReply);

}